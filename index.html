<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08283b"><title>Halcyon | Scan Your Way to Vitality</title><style>
:root{font-family:Georgia,serif;color:#102e3c;background:#f6f1e8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#faf7f1,#eae2d4);min-height:100vh}.hero{background:#08283b;color:#f1cc8e;text-align:center;padding:35px 18px 30px}.lotus{font-size:35px}.brand{font-size:32px;letter-spacing:5px}.small{font:12px Arial,sans-serif;letter-spacing:3px}.script{font-size:27px;font-style:italic;margin-top:22px}.container{max-width:530px;margin:25px auto;padding:0 17px 40px}.panel{background:#fffdfa;border:1px solid #d9b677;border-radius:15px;padding:26px;box-shadow:0 12px 30px #172a3015}.eyebrow{font:700 12px Arial,sans-serif;letter-spacing:2px;color:#9b6e32}h1{font-size:25px;line-height:1.35;font-weight:normal}p{line-height:1.6}input{width:100%;font-size:18px;padding:14px;border:1px solid #c7bda9;border-radius:7px}button{border:0;background:#092d40;color:white;font:700 15px Arial,sans-serif;padding:15px 18px;border-radius:8px;cursor:pointer;width:100%;margin-top:12px}.secondary{background:transparent;color:#092d40;border:1px solid #a98c5e}.status{font:14px Arial,sans-serif;margin:12px 0}.success{color:#17643c}.error{color:#ad342f}.progress{display:flex;gap:5px;margin-bottom:22px}.dot{height:6px;flex:1;background:#d8d5cf;border-radius:8px}.dot.done{background:#c3944d}.hidden{display:none}.note{font:12px Arial,sans-serif;color:#666;margin-top:18px}.next{background:#f6eee0;padding:15px;border-left:3px solid #c49b59;border-radius:6px;margin-top:16px}.center{text-align:center}a{color:#0c526f}
</style></head><body><header class="hero"><div class="lotus">❀</div><div class="brand">HALCYON</div><div class="small">HEALTH &amp; VITALITY</div><div class="script">Scan Your Way to Vitality</div></header><main class="container"><div class="panel"><div id="progress" class="progress"></div><div id="content"></div></div><div class="note center">A self-guided wellness discovery experience. No personal information collected.</div></main><script>
const stages=[
 {question:'I’m a pulsed-field wellness modality. What do my four letters stand for?',answers:['pulsed electromagnetic field','pulsed electromagnetic fields','pulsed electromagnetic field therapy','pemf'],hint:'Think energy, not just exercise.',next:'Find the wellness experience that is straight from Italy and uses infrared light and light activity to promote healing.'},
 {question:'I am the ONLY one in Michigan and help support cellular energy as well as reduce pain and inflammation. What am I called?',answers:['infrabaldan','infra baldan'],hint:'Look for the name on the equipment.',next:'Find the sauna that combines warmth and red light.'},
 {question:'I combine heat with red light therapy. What am I?',answers:['sauna'],hint:'Think sweat and light.',next:'Find the space for hands-on relaxation.'},
 {question:'I’m hands-on, relaxing, and a favorite for easing muscle tension. What service am I?',answers:['massage','massage therapy'],hint:'It’s a classic for a reason.',next:'Find the vibration platform used for movement and recovery.'},
 {question:'I’m a high-frequency vibration platform that helps build strength, improve balance, and boost recovery. What am I?',answers:['power plate','powerplate'],hint:'You might stand, sit, or move on me.',next:'Find the display of wellness products focused on cellular health.'},
 {question:'I’m a wellness product focused on cellular health and renewal. What am I?',answers:['asea','asea redox'],hint:'It’s more than a drink — it’s a lifestyle.',next:'Find the Red Light Therapy Room and scan its QR code.'},
 {question:'I use therapeutic wavelengths of red and near-infrared light to support cellular function, skin health, and recovery. What am I?',answers:['red light therapy','red-light therapy'],hint:'Think of the therapeutic light experience.',next:'Return to the front desk and scan the Final Entry card.'}
];
const params=new URLSearchParams(location.search);let station=params.get('station')||'welcome';const el=document.getElementById('content');const prog=document.getElementById('progress');let completed=Number(localStorage.getItem('halcyon_progress')||'0');const normalize=x=>x.toLowerCase().replace(/[^a-z0-9]/g,'');function drawProgress(){prog.innerHTML=Array.from({length:7},(_,i)=>`<div class="dot ${i<completed?'done':''}"></div>`).join('')};function show(html){drawProgress();el.innerHTML=html};function start(){localStorage.setItem('halcyon_progress','0');completed=0;show('<div class="eyebrow">WELCOME</div><h1>Your journey begins!</h1><p>Your first destination is the room with a pulsed electromagnetic field wellness experience. Find its printed card and scan the QR code there.</p><p class="note">You must visit each station in order. Answers are not displayed on the printed cards.</p>')};function render(){if(station==='welcome'){show('<div class="eyebrow">WELCOME TO HALCYON</div><h1>Discover seven wellness experiences</h1><p>Scan the printed QR codes as you explore the center. Answer each question correctly to unlock the clue for your next destination.</p><button id="start">Start the Hunt</button>');document.getElementById('start').onclick=start;return}if(station==='final'){show(completed>=7?'<div class="eyebrow">WELL DONE</div><h1>Congratulations! ✨</h1><p>You completed all seven Halcyon wellness challenges.</p><p>Show this screen to the front desk to confirm completion.</p><button class="secondary" id="reset">Start Over</button>':'<h1>One more step!</h1><p>Complete all seven station challenges before scanning the final card.</p>');let b=document.getElementById('reset');if(b)b.onclick=()=>{localStorage.removeItem('halcyon_progress');location.href='?station=welcome'};return}const n=Number(station);if(!Number.isInteger(n)||n<1||n>7){show('<h1>QR code not recognized</h1><p>Please scan a Halcyon scavenger hunt card.</p>');return}if(completed<n-1){show('<div class="eyebrow">STATION '+n+'</div><h1>Not unlocked yet</h1><p>Complete the previous station before continuing. Return to the last room you visited.</p>');return}const s=stages[n-1];if(completed>=n){show(`<div class="eyebrow">STATION ${n} COMPLETED</div><h1>Correct answer!</h1><div class="next"><strong>Your next destination</strong><p>${s.next}</p></div>`);return}show(`<div class="eyebrow">STATION ${n} OF 7</div><h1>${s.question}</h1><form id="answerform"><label for="answer">Enter your answer</label><input id="answer" autocomplete="off" required placeholder="Type your answer"><button>Check Answer</button></form><p id="feedback" class="status" aria-live="polite"></p><button class="secondary" id="hint">Need a hint?</button><p id="hinttext" class="hidden note">${s.hint}</p>`);document.getElementById('hint').onclick=()=>document.getElementById('hinttext').classList.toggle('hidden');document.getElementById('answerform').onsubmit=e=>{e.preventDefault();let a=document.getElementById('answer').value;let ok=s.answers.some(v=>normalize(v)===normalize(a));if(ok){completed=n;localStorage.setItem('halcyon_progress',String(n));render()}else{document.getElementById('feedback').textContent='Not quite — try again!';document.getElementById('feedback').className='status error'}}}render();
</script></body></html>
